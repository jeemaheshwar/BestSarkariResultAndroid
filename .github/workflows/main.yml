name: Build Installable Lite APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bestsarkariresult-native-lite

    steps:
      - name: Get Source
        uses: actions/checkout@v4

      - name: Set Up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Best-Sarkari-Result-OneSignal-APK
          path: bestsarkariresult-native-lite/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
